name: Validate distribution
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run python scripts/validate_distribution.py
      - run: uv run ruff check --select E9,F63,F7,F82 plugins scripts
      - run: uv run python plugins/avatar-head-transplant/skills/transplant-avatar-head/scripts/test_alignment_renderer.py
